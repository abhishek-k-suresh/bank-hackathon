<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window backgrounds preview</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body { background: #f3f2ee; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #1c1c1a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 14px; font-size: 13px; color: #555; }
  .pickrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pickrow button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid #c9c9c4; background: #fff; cursor: pointer; }
  .pickrow button.on { background: #1f1c4f; color: #fff; border-color: #1f1c4f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  figcaption { font-weight: 700; font-size: 14px; padding: 2px 2px 8px; }
  .scene-wrap { max-width: 340px; cursor: default; }
</style>
</head>
<body>
  <h1>Window backgrounds</h1>
  <p>The same window on each of the five backgrounds, at phone size (340 px wide). Use the buttons to check other moods and the avatar.</p>
  <div class="pickrow" id="moods"></div>
  <div class="pickrow" id="sets"></div>
  <div class="grid" id="grid"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/art.js"></script>
  <script>
    // Same engine state as the app's default (normal month, today), built without app.js.
    const actions = { cancelled: new Set(), paidCard: false, sentToFuture: 0, levers: { commit: true, subs: false, delivery: false, coffee: false, roundups: false }, pauseTransfers: false, coverFromSavings: 0, coverSource: "ef", rentMoved: false, humanRequested: false, autos: {}, added: {} };
    const S = buildState({ scenario: "normal", actions, customTx: null, calm: false, assumptions: { ...ASSUMPTIONS }, track: "same" });
    const FV = futureView(S, 0);
    const show = { auto: true, avatar: true, hero: true, others: true, shield: true, vault: true, loan: true };
    const MOODS = ["thriving", "happy", "okay", "worried", "stressed", "calm"];
    let mood = FV.mood.mood;

    function draw() {
      document.getElementById("moods").innerHTML = MOODS.map(m => `<button class="${m === mood ? "on" : ""}" data-mood="${m}">${m}</button>`).join("");
      document.getElementById("sets").innerHTML = [["m", "Male avatar"], ["f", "Female avatar"]].map(([k, l]) => `<button class="${AVATAR_SET === k ? "on" : ""}" data-set="${k}">${l}</button>`).join("");
      const calm = mood === "calm";
      const fv = { ...FV, mood: { ...FV.mood, mood: calm ? "stressed" : mood } };
      document.getElementById("grid").innerHTML = BACKGROUNDS.map(([id, label]) => {
        SCENE_BG = id;
        return `<figure><figcaption>${label}</figcaption><div class="scene-wrap">${sceneSvg(fv, { show, calm, uid: id, insured: true, quests: 5 })}</div></figure>`;
      }).join("");
      // the app animates fills from data attributes; here just apply the final values
      document.querySelectorAll("[data-anim]").forEach(el => el.style.setProperty(el.dataset.prop, el.dataset.to));
    }
    document.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.mood) mood = b.dataset.mood;
      if (b.dataset.set) AVATAR_SET = b.dataset.set;
      draw();
    });
    draw();
  </script>
</body>
</html>
